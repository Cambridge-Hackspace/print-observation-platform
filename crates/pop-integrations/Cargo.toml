[package]
name = "pop-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A fake BAM! and a fake go2rtc that serve answers recorded from real ones
# (#20, #66), for tests here and in the server.
fakes = ["dep:axum", "dep:bytes"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", optional = true, features = ["ws", "query"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# The machine's own trusted certificates, as reqwest uses them: a BAM! behind
# the space's own certificate authority is trusted once the system is told.
rustls-platform-verifier = "0.7"
# Card taps at a kiosk's reader, from the space's broker (#19): CS:S's own
# wire types, MIT-licensed on their own and pinned by tag, and the MQTT client
# the Bambu driver uses.
css_wire = { git = "https://github.com/Cambridge-Hackspace/cooperative-systems-spaces", tag = "css_wire-v0.2.0" }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
bytes = { version = "1", optional = true }
tracing = "0.1"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
pop-integrations = { path = ".", features = ["fakes"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
