[package]
name = "pop-server"
description = "POP's server: the API, live updates, slicer uploads and the web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pop"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
pop-integrations = { version = "0.1.2", path = "../pop-integrations" }
pop-printers = { version = "0.1.2", path = "../pop-printers" }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ts-rs = "11"

[dev-dependencies]
http-body-util = "0.1"
pop-integrations = { path = "../pop-integrations", features = ["fakes"] }
pop-printers = { path = "../pop-printers", features = ["fakes"] }
regex-automata = "0.4"
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
