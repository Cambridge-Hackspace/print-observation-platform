[package]
name = "pop-server"
description = "POP's server: the API, live updates, slicer uploads and the web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pop"
path = "src/main.rs"

[dependencies]
# Signing in through an OpenID Connect provider, CS:S first (#14, #16): no
# HTTP client of its own; POP's reqwest makes its requests.
openidconnect = { version = "=4.1.0", default-features = false }
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
# This machine's MAC address, which CS:S records when POP registers (#18).
mac_address = "1.1"
pop-integrations = { version = "0.1.2", path = "../pop-integrations" }
pop-printers = { version = "0.1.2", path = "../pop-printers" }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ts-rs = "11"

[dev-dependencies]
# The card sign-in tests play CS:S's edge with its own seal code (#18), by
# the one CS:S tag pop-integrations uses, so there is one css_wire.
css_wire = { git = "https://github.com/Cambridge-Hackspace/cooperative-systems-spaces", tag = "v0.6.0" }
css_wire_sign = { git = "https://github.com/Cambridge-Hackspace/cooperative-systems-spaces", tag = "v0.6.0" }
http-body-util = "0.1"
pop-integrations = { path = "../pop-integrations", features = ["fakes"] }
pop-printers = { path = "../pop-printers", features = ["fakes"] }
regex-automata = "0.4"
# A test sign-in provider signs its ID tokens itself (tests/sign_in.rs), so
# what POP verifies is not made by the code that verifies it.
rsa = { version = "0.9", features = ["sha2"] }
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
