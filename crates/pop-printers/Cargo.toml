[package]
name = "pop-printers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fake printers that speak each real protocol over a real socket (#26), for
# tests here and elsewhere.
fakes = []

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
ts-rs = "11"

[dev-dependencies]
pop-printers = { path = ".", features = ["fakes"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
