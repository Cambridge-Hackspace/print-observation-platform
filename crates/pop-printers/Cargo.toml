[package]
name = "pop-printers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fake printers that speak each real protocol over a real socket (#26), for
# tests here and elsewhere.
fakes = ["dep:tokio-rustls", "dep:rcgen", "dep:bytes"]
tokio-rustls = ["dep:tokio-rustls"]
rcgen = ["dep:rcgen"]
bytes = ["dep:bytes"]

[lints]
workspace = true

[dependencies]
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
rcgen = { version = "0.13", optional = true }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-rustls = { version = "0.26", optional = true }
tokio-tungstenite = "0.26"
tracing = "0.1"
ts-rs = "11"

[dev-dependencies]
pop-printers = { path = ".", features = ["fakes"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
