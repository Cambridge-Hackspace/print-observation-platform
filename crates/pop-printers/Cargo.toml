[package]
name = "pop-printers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fake printers that speak each real protocol over a real socket (#26), for
# tests here and elsewhere.
fakes = ["dep:rcgen", "dep:bytes", "dep:axum", "dep:md-5"]
rcgen = ["dep:rcgen"]
bytes = ["dep:bytes"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", optional = true }
bytes = { version = "1", optional = true }
# HTTP Digest, as PrusaLink on the printer asks (#30).
digest_auth = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
md-5 = { version = "0.10", optional = true }
rcgen = { version = "0.13", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
tracing = "0.1"
ts-rs = "11"

[dev-dependencies]
pop-printers = { path = ".", features = ["fakes"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
