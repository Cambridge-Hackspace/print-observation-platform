# POP's configuration, with every key at its default.
#
# Copy this to pop.toml beside the binary, or name another file with
# `pop --config <file>` or POP_CONFIG. Any key can be left out, and then has
# the value shown here. `pop config check` validates a file without starting
# the server.
#
# Every key can also be set from the environment, as POP_<SECTION>_<KEY> in
# capitals, which wins over the file: POP_SERVER_LISTEN overrides
# server.listen. Use that for secrets, and in containers.

[server]
# The address and port to listen on. 0.0.0.0:8080 listens on every network.
listen = "127.0.0.1:8080"
# The address phones reach POP at, shown on the tower as a QR code:
# "https://pop.example.org". Empty: no QR code.
public_url = ""

[storage]
# Where the database and the stored print files live. Back it up with
# `pop backup`.
data_dir = "data"

[log]
# error, warn, info, debug or trace.
level = "info"
# text, for a person reading a terminal, or json, one object per line, for a
# log collector.
format = "text"

[access]
# The space's own networks, in CIDR notation. A request from one of these is
# LOCAL while an enrolled kiosk has checked in from that same network in the
# last two minutes (#12): signed out it sees everything, a member controls
# printers. Online, a member only watches and a stranger sees nothing. Admins
# hold every class from anywhere. Empty: nothing is local.
#
# local_networks = ["192.168.1.0/24"]
local_networks = []
# Reverse proxies whose forwarding headers (Forwarded, X-Forwarded-For) are
# believed, in CIDR notation. A request carrying those headers from anything
# else is remote, whatever its address: otherwise a proxy on this machine
# would make every request it passes on look local. Name your proxy here if
# you put one in front of POP (docs: remote access). Have it set ONE of the
# two headers, replacing whatever the client sent: a request carrying both is
# remote, since a client could have written either.
#
# trusted_proxies = ["127.0.0.1/32"]
trusted_proxies = []

[bam]
# Where POP reads its printers (docs/integrations/bam.md). Empty: no BAM!.
url = ""
# POP's BAM! API token. A secret: give it as POP_BAM_TOKEN, not here.
token = ""
# The id of the BAM! category whose assets are the printers.
category = ""

[bam.fields]
# Which field of the printer category, by its key, gives each printer's
# connection (moonraker, octoprint, prusalink, bambu or usb_serial), address,
# camera, model, materials (comma-separated), training level, a Bambu
# printer's serial number, and the CS:S tool whose training it needs.
connection = "connection"
address = "address"
camera = "camera"
model = "model"
materials = "materials"
training = "training"
serial = "serial"
css_tool = "css_tool"

[go2rtc]
# The go2rtc that serves the printers' cameras, as its own service
# (docs/integrations/go2rtc.md): its API address, http://127.0.0.1:1984.
# Empty: no cameras.
url = ""
# go2rtc's api.username and api.password. Set go2rtc's local_auth too, or
# go2rtc asks nothing of requests from its own machine. The password is a
# secret: give it as POP_GO2RTC_PASSWORD, not here.
username = ""
password = ""

[secrets]
# Seals the secrets POP keeps, such as a Bambu printer's access code: 32
# random bytes in base64, as `openssl rand -base64 32` makes. A secret: give
# it as POP_SECRETS_KEY, not here. Empty: POP refuses to keep secrets.
key = ""

[guides]
# The license each published guide is shown under, such as "CC BY-SA 4.0".
# Empty: none is shown.
license = ""
# Whether search engines may index the public guides at /guides.
indexable = false

[kiosk]
# How long a session started at the kiosk lasts with the screen left alone, in
# seconds (#12): the countdown it shows. 15 to 3600.
idle_secs = 90

[public]
# What the live stream (/api/events) carries to anyone who is neither signed
# in nor on the space's network: the public, watching from outside. Whether
# owners' first names go out on it. Off: nobody is named, in a printer's job
# or a notice. Signed-in screens, and the space's own network (the kiosk),
# always see names.
owner_names = false

[feedback]
# Feedback from any screen, filed as GitHub issues by a GitHub App installed
# on the repository with Issues: write and Contents: write. The repository is
# public, so the issues and their screenshots are too. Empty app_id: no
# feedback button anywhere.
app_id = ""
installation_id = ""
# The App's private key, as GitHub gives it: a file only POP can read.
private_key_file = ""
repo = "Cambridge-Hackspace/print-observation-platform"
api = "https://api.github.com"
# The branch screenshots go on.
branch = "feedback-attachments"
# Who holds feedback.file: "admin", "member".
roles = ["admin"]
# Reports one person may file in an hour.
per_hour = 10

# Signing in through OpenID Connect providers (#14), CS:S first (#16):
# docs/integrations/sign-in.md. None by default; each is a table like this:
#
# [[sign_in.providers]]
# id = "css"                              # in POP's addresses; keep it fixed
# label = "CS:S"                          # "Sign in with CS:S"
# issuer = "https://css.example.org"
# client_id = "pop"
# # client_secret: give it as POP_SIGN_IN_CSS_CLIENT_SECRET, not here.
# scopes = ["profile", "roles"]           # beside "openid"
# roles_claim = "roles"                   # the ID token claim listing roles
# admin_roles = []                        # any of these makes a POP admin

# A card tap at a kiosk's reader signs the member in (#18): POP is a CS:S
# device, registered once with `popctl css-device register`, and needs the
# secrets key to keep that identity: docs/integrations/card-sign-in.md. Off
# while broker is empty. Each kiosk's card reader is set on the admin desk.
[card_sign_in]
# The [[sign_in.providers]] whose accounts taps sign in to, by its id, as "css".
provider = ""
# The space's broker, where CS:S's edge leases its devices:
# mqtt://host[:port] (1883) or mqtts://host[:port] (8883).
broker = ""
# POP's login on the broker, if it asks for one.
username = ""
# password: give it as POP_CARD_SIGN_IN_PASSWORD, not here.

# Where training comes from (#17): docs/integrations/training.md.
[training]
# "local": admins tick each account's training on POP's desk, and a printer
# needs its BAM! training level. "css": CS:S says, asked at each use, and a
# printer needs its BAM! CS:S tool.
source = "local"
# With source = "css": the [[sign_in.providers]] that is CS:S, by its id. It
# needs a client secret, and the training:members scope in CS:S.
provider = ""
