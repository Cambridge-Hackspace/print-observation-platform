# go2rtc as tools/go2rtc/record.py expects it: loopback only, no streams of
# its own, its API behind a user name and password. go2rtc skips the
# password for requests from its own machine unless local_auth is on.
api:
  listen: "127.0.0.1:18984"
  username: "pop"
  password: "recording-only"
  local_auth: true
rtsp:
  listen: "127.0.0.1:18554"
webrtc:
  listen: "127.0.0.1:18555"
