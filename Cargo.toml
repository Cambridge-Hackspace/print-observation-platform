[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
# The reaper battery's toolchain image is rust:1.97 (.reaper.toml).
rust-version = "1.97"
license = "BlueOak-1.0.0"
repository = "https://github.com/Cambridge-Hackspace/print-observation-platform"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Debug builds keep line tables only, and dependencies none: a backtrace
# still names POP's file and line, but a debugger cannot show variables. Full
# debug info made each of the 44 test binaries 150-300 MB, and target/ grew to
# tens of gigabytes. For a debugging session, override it for that build:
# CARGO_PROFILE_DEV_DEBUG=true cargo test ...
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing is deliberately slow; unoptimized, it is slow enough to
# make the tests that sign in crawl. Optimizing these crates alone keeps the
# rest of a debug build debuggable.
[profile.dev.package.argon2]
opt-level = 3
