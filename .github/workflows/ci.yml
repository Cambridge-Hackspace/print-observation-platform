# The whole battery on every push and pull request: tools/check.sh, the same
# script the reaper battery runs (.reaper.toml), in the same pinned images.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tools/check.sh
        env:
          CONTAINER: docker
        run: tools/check.sh
