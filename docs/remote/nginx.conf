# Remote watching through nginx (docs/remote-access.md, #93).
#
# A server block for the address members use from outside the space. It
# forwards the web app and only the API routes POP allows from anywhere;
# every other API path, the routes that control a printer or change where
# notices go among them, is refused here before it reaches POP, which refuses
# them too (#7). crates/pop-server/tests/remote_access.rs holds this file to
# POP's route table: change a route, and that test says what to change here.
#
# Replace pop.example.org, the certificate paths, and 127.0.0.1:8080 (where
# POP listens) with yours. Name this proxy in POP's [access] trusted_proxies.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pop.example.org;
    ssl_certificate     /etc/letsencrypt/live/pop.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pop.example.org/privkey.pem;

    # Who the request came from, as POP judges it (#7). Set, never appended
    # to: a forwarding header the client sent is thrown away, so nobody
    # outside can claim to be inside the space.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;

    # Feedback screenshots (#96) are up to a few megabytes.
    client_max_body_size 8m;

    # ---- refused: any API path not named below --------------------------------
    location /api/ {
        return 404;
    }

    # ---- the web app: files only, it changes nothing -------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---- health and status ------------------------------------------------------
    location = /healthz { proxy_pass http://127.0.0.1:8080; }
    location = /api/status { proxy_pass http://127.0.0.1:8080; }

    # ---- the live stream: Server-Sent Events, held open -----------------------
    location = /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # ---- signing in and out, and who you are ---------------------------------
    location = /api/session { proxy_pass http://127.0.0.1:8080; }
    location = /api/me { proxy_pass http://127.0.0.1:8080; }
    # Each person's own slicer keys (#13), and the slicer's connection test,
    # which only a key answers: so a slicer at home reaches POP.
    location = /api/keys { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/keys/[^/]+$ { proxy_pass http://127.0.0.1:8080; }
    location = /api/version { proxy_pass http://127.0.0.1:8080; }

    # ---- guides, for anyone ------------------------------------------------------
    location = /api/public/guides { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/public/guides/[^/]+$ { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/public/guides/[^/]+/images/[^/]+$ { proxy_pass http://127.0.0.1:8080; }
    location = /api/public/error-guides { proxy_pass http://127.0.0.1:8080; }

    # ---- watching a print, and saying something looks wrong (#61, #63) --------
    location ~ ^/api/printers/[^/]+/camera/mse$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
    location ~ ^/api/printers/[^/]+/camera/mjpeg$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location ~ ^/api/printers/[^/]+/report$ { proxy_pass http://127.0.0.1:8080; }

    # ---- feedback (#96) ---------------------------------------------------------
    location = /api/feedback { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/feedback/[^/]+$ { proxy_pass http://127.0.0.1:8080; }

    # ---- the admin desk, from anywhere: an admin online holds every class ----
    # (#12): accounts, guides, the audit log, printers' settings, where notices
    # go, and kiosks. Each admin sign-in from outside is told to the group chat.
    location = /api/admin/printers { proxy_pass http://127.0.0.1:8080; }
    location = /api/admin/cameras { proxy_pass http://127.0.0.1:8080; }
    # The running version, and what the updater last did (#148).
    location = /api/admin/updater { proxy_pass http://127.0.0.1:8080; }
    location = /api/admin/users { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/admin/users/[^/]+/(password|role|name|active|training)$ { proxy_pass http://127.0.0.1:8080; }
    location = /api/admin/guides { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/admin/guides/[^/]+$ { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/admin/guides/[^/]+/images(/[^/]+)?$ { proxy_pass http://127.0.0.1:8080; }
    location = /api/admin/error-guides { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/admin/error-guides/[^/]+$ { proxy_pass http://127.0.0.1:8080; }
    location = /api/admin/audit { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/admin/printers/[^/]+/(add|decline|access-code|camera-login|printer-login)$ { proxy_pass http://127.0.0.1:8080; }
    location = /api/admin/notify { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/admin/notify/discord(/test)?$ { proxy_pass http://127.0.0.1:8080; }
    location = /api/admin/kiosks { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/api/admin/kiosks/[^/]+$ { proxy_pass http://127.0.0.1:8080; }

    # ---- a kiosk's check-in. Forwarded, and harmless from outside: POP takes
    # the address it came from, and an address outside the space's networks
    # makes no network the space's (#12).
    location = /api/kiosk/checkin { proxy_pass http://127.0.0.1:8080; }
}
